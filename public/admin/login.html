<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acceso administrador · Cabañas Chiloé</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <a class="back-link" href="/">← Inicio</a>
    <p class="eyebrow">Panel de administración</p>
    <h1>Iniciar sesión</h1>
    <p class="muted">Ingresa con la cuenta autorizada para administrar las cabañas y reservas.</p>
    <form id="login-form" class="stack-form">
      <label for="email">Correo electrónico</label>
      <input id="email" name="email" type="email" autocomplete="username" required>
      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button class="button" type="submit">Ingresar</button>
      <p id="login-message" class="notice" role="status" aria-live="polite"></p>
    </form>
  </main>
  <script type="module" src="/admin/login.js"></script>
</body>
</html>
