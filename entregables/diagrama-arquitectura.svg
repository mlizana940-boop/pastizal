<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940" role="img" aria-labelledby="title desc">
  <title id="title">Arquitectura cliente-servidor de Reservas de Cabañas en Chiloé</title>
  <desc id="desc">Los navegadores cargan las interfaces desde Express. Firebase Authentication emite ID tokens que Express valida. La API aplica reglas y accede a Firestore. Firestore conserva las URLs HTTPS públicas de las imágenes y los navegadores las cargan directamente desde los sitios externos.</desc>
  <defs>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#315b42"/></marker>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#496589"/></marker>
    <marker id="arrow-gold" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#946b1b"/></marker>
    <style>
      text { font-family: Arial, sans-serif; fill:#18352a; }
      .title { font-size:32px; font-weight:700; }
      .subtitle { font-size:16px; fill:#51645a; }
      .group-title { font-size:19px; font-weight:700; }
      .node-title { font-size:18px; font-weight:700; }
      .body { font-size:15px; fill:#33483c; }
      .small { font-size:13px; fill:#56685d; }
      .edge-label { font-size:13px; font-weight:600; fill:#344a3c; }
      .edge { fill:none; stroke:#315b42; stroke-width:2.5; marker-end:url(#arrow-green); }
      .edge-blue { fill:none; stroke:#496589; stroke-width:2.5; marker-end:url(#arrow-blue); }
      .edge-gold { fill:none; stroke:#946b1b; stroke-width:2.5; marker-end:url(#arrow-gold); }
      .node { fill:#fffefa; stroke:#547260; stroke-width:1.7; rx:13; }
      .node-blue { fill:#edf2f8; stroke:#496589; stroke-width:1.8; rx:13; }
      .node-gold { fill:#fff4d9; stroke:#946b1b; stroke-width:1.8; rx:13; }
      .vm { fill:#eef3ed; stroke:#315b42; stroke-width:2.5; rx:22; }
      .soft { fill:#f8f6ef; }
    </style>
  </defs>
  <rect width="1440" height="940" fill="#f8f6ef"/>
  <text x="55" y="58" class="title">Reservas de cabañas en Chiloé</text>
  <text x="55" y="88" class="subtitle">Arquitectura principal: cliente-servidor · Flujo contrastado con el código del repositorio</text>

  <rect x="48" y="125" width="258" height="235" rx="18" class="soft" stroke="#c9d4c9"/>
  <text x="70" y="158" class="group-title">Navegador</text>
  <rect x="70" y="178" width="215" height="72" class="node"/>
  <text x="88" y="207" class="node-title">Cliente</text>
  <text x="88" y="230" class="body">Catálogo · búsqueda · reserva</text>
  <rect x="70" y="270" width="215" height="67" class="node"/>
  <text x="88" y="297" class="node-title">Administrador</text>
  <text x="88" y="321" class="body">Panel · cabañas · solicitudes</text>

  <rect x="360" y="122" width="786" height="590" class="vm"/>
  <text x="390" y="158" class="group-title">Máquina virtual Azure del equipo</text>
  <text x="390" y="181" class="small">Node.js + Express · configuración exacta del recurso a completar por el responsable Azure</text>

  <rect x="394" y="215" width="214" height="92" class="node"/>
  <text x="415" y="245" class="node-title">Vistas web</text>
  <text x="415" y="269" class="body">public/cliente</text>
  <text x="415" y="290" class="body">public/admin · CSS · JS</text>

  <rect x="655" y="215" width="220" height="92" class="node"/>
  <text x="676" y="245" class="node-title">API Express</text>
  <text x="676" y="269" class="body">Rutas y controladores</text>
  <text x="676" y="290" class="body">/api y /api/admin</text>

  <rect x="924" y="215" width="190" height="92" class="node"/>
  <text x="944" y="245" class="node-title">Middleware</text>
  <text x="944" y="269" class="body">Verifica ID token</text>
  <text x="944" y="290" class="body">y rol administrador</text>

  <rect x="655" y="356" width="220" height="105" class="node"/>
  <text x="676" y="387" class="node-title">Servicios y modelos</text>
  <text x="676" y="411" class="body">Validación de datos</text>
  <text x="676" y="432" class="body">Disponibilidad y estados</text>
  <text x="676" y="451" class="body">Reglas de negocio</text>

  <rect x="924" y="356" width="190" height="105" class="node-blue"/>
  <text x="944" y="387" class="node-title">Repositorios</text>
  <text x="944" y="411" class="body">Firebase Admin SDK</text>
  <text x="944" y="432" class="body">Acceso a Firestore</text>

  <rect x="1190" y="590" width="205" height="120" class="node-gold"/>
  <text x="1211" y="625" class="node-title">Sitio externo</text>
  <text x="1211" y="652" class="body">URL HTTPS pública</text>
  <text x="1211" y="677" class="small">Aloja los archivos</text>

  <rect x="1190" y="386" width="205" height="152" class="node-blue"/>
  <text x="1211" y="420" class="node-title">Cloud Firestore</text>
  <text x="1211" y="447" class="body">cabanas · imagenUrl HTTPS</text>
  <text x="1211" y="470" class="body">reservas</text>
  <text x="1211" y="493" class="body">nochesOcupadas</text>
  <text x="1211" y="518" class="small">Bloqueo por cabaña y fecha</text>

  <rect x="1190" y="150" width="205" height="120" class="node-gold"/>
  <text x="1211" y="184" class="node-title">Firebase Authentication</text>
  <text x="1211" y="211" class="body">Cuentas de cliente/admin</text>
  <text x="1211" y="234" class="body">Emite ID tokens</text>
  <text x="1211" y="256" class="small">No es un servicio Azure</text>

  <path d="M285 205 H394" class="edge" marker-start="url(#arrow-green)"/>
  
  <path d="M285 299 H350 V262 H394" class="edge" marker-start="url(#arrow-green)"/>
  <text x="309" y="324" class="edge-label">Acceso al panel</text>

  <path d="M306 340 H628 V261 H655" class="edge" marker-start="url(#arrow-green)"/>
  <text x="430" y="316" class="edge-label">Catálogo público · Bearer en reserva, Mis reservas y admin · URL HTTPS</text>
  
  

  <path d="M608 261 H655" class="edge"/>
  <path d="M875 261 H924" class="edge"/>
  <path d="M1019 307 V356" class="edge"/>
  <path d="M875 408 H924" class="edge"/>
  <path d="M1114 408 H1190" class="edge-blue"/>
  <text x="1200" y="558" class="edge-label">Lecturas y escrituras</text>

  <path d="M306 236 H340 V108 H1165 V210 H1190" class="edge-gold" marker-start="url(#arrow-gold)"/>
  
  
  

  <path d="M285 299 H330 V735 H1165 V650 H1190" class="edge-gold"/>
  <text x="470" y="729" class="edge-label">La vista previa y el catálogo cargan la imagen desde la URL</text>

  <rect x="48" y="770" width="1347" height="125" rx="18" fill="#fffefa" stroke="#d7ddd4"/>
  <text x="72" y="808" class="group-title">Reglas clave del flujo</text>
  <text x="72" y="839" class="body">• La API vuelve a validar fechas, huéspedes y capacidad antes de guardar.</text>
  <text x="72" y="864" class="body">• Una transacción crea la reserva pendiente y bloquea cada noche; rechazar o cancelar libera los bloqueos.</text>
  <text x="790" y="839" class="body">• Firestore bloquea el acceso directo desde el navegador.</text>
  <text x="790" y="864" class="body">• Firestore guarda la URL; el archivo permanece alojado externamente.</text>
</svg>






